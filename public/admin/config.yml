backend:
  name: github
  repo: zajiir/chahid-el-batti-site
  branch: main
  # Auth via le proxy OAuth intégré de Netlify (Client ID + secret
  # enregistrés côté Netlify, voir Site settings → OAuth) plutôt qu'en PKCE
  # direct — c'est l'intégration standard pour un site hébergé sur Netlify.

# Dossier par défaut des fichiers envoyés depuis l'admin (servis tels quels
# par le site). Les images de Travaux ont leurs propres dossiers, plus bas.
media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: simple
locale: fr

collections:
  - name: "pages"
    label: "📄 Pages du site"
    description: "Le texte de chaque page — dans l'ordre du menu. Les images de Travaux sont dans les 3 rubriques « Travaux » juste en dessous."
    files:
      - file: "src/content/home.json"
        label: "Accueil"
        name: "home"
        fields:
          - { label: "Nom affiché", name: "name", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "string" }
          - { label: "Sous-titre (anglais — vide = texte français)", name: "subtitle_en", widget: "string", required: false }

      - file: "src/content/music.json"
        label: "02 — Music"
        name: "music"
        fields:
          - label: "Sortie mise en avant"
            name: "release"
            widget: "object"
            collapsed: false
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Artiste", name: "artist", widget: "string" }
              - label: "Date de sortie"
                name: "date"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false
              - label: "Pochette"
                name: "cover"
                widget: "image"
                media_folder: "/public/music"
                public_folder: "/music"
                hint: "Image carrée — sert aussi de fond flouté à la page."
              - { label: "Lien Bandcamp de l'album", name: "bandcampUrl", widget: "string" }
              - label: "Identifiant Bandcamp de l'album"
                name: "bandcampAlbumId"
                widget: "string"
                hint: "Sur Bandcamp : Partager / Intégrer → copier le nombre qui suit « album= » dans le code."
              - label: "Texte / poème"
                name: "poem"
                widget: "text"
                hint: "Une ligne = un vers. L'arabe s'affiche correctement tel quel."
              - { label: "Crédits", name: "credits", widget: "text", required: false }
              - { label: "Lien « en savoir plus »", name: "moreUrl", widget: "string", required: false }
          - label: "Vidéo"
            name: "video"
            widget: "object"
            collapsed: false
            fields:
              - label: "Lien de la vidéo"
                name: "url"
                widget: "string"
                required: false
                hint: "Lien YouTube ou Vimeo (ou fichier .mp4). Laisse vide : un emplacement « Vidéo — bientôt » s'affiche."
              - { label: "Titre affiché", name: "title", widget: "string", required: false }
              - { label: "Titre affiché (anglais — vide = texte français)", name: "title_en", widget: "string", required: false }
          - label: "Plateformes"
            name: "platforms"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom (ex. Spotify)", name: "name", widget: "string" }
              - { label: "Texte affiché (ex. Profil artiste)", name: "handle", widget: "string" }
              - { label: "Texte affiché (anglais — vide = texte français)", name: "handle_en", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string" }

      - file: "src/content/arena.json"
        label: "03 — Are.na"
        name: "arena"
        fields:
          - { label: "Lien du profil Are.na", name: "profile", widget: "string" }
          - label: "Channels affichés"
            name: "channels"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Dans l'ordre d'affichage. Le contenu (images, textes) se met à jour tout seul depuis Are.na."
            fields:
              - label: "Identifiant du channel"
                name: "slug"
                widget: "string"
                hint: "La fin de l'adresse du channel : are.na/zaji-ir/<identifiant>"
              - { label: "Nom affiché", name: "title", widget: "string" }
              - label: "Note"
                name: "note"
                widget: "string"
                required: false
                hint: "Laisse vide pour reprendre la description du channel sur Are.na."
              - { label: "Note (anglais — vide = texte français)", name: "note_en", widget: "string", required: false }

      - file: "src/content/friends.json"
        label: "04 — Friends"
        name: "friends"
        fields:
          - { label: "Titre", name: "heading", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text", required: false }
          - { label: "Introduction (anglais — vide = texte français)", name: "intro_en", widget: "text", required: false }
          - label: "Message d'attente"
            name: "message"
            widget: "string"
            hint: "Affiché tant que la liste ci-dessous est vide."
          - { label: "Message d'attente (anglais — vide = texte français)", name: "message_en", widget: "string", required: false }
          - label: "Amis / collaborations"
            name: "friends"
            widget: "list"
            summary: "{{fields.name}}"
            required: false
            fields:
              - { label: "Nom", name: "name", widget: "string" }
              - { label: "Rôle / discipline", name: "role", widget: "string", required: false }
              - { label: "Rôle / discipline (anglais — vide = texte français)", name: "role_en", widget: "string", required: false }
              - label: "Portrait"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/public/friends"
                public_folder: "/friends"
                hint: "Format portrait de préférence. Sans photo, ses initiales s'affichent sur fond bleu."
              - { label: "Lien (Instagram, site…)", name: "url", widget: "string", required: false }

      - file: "src/content/parcours.json"
        label: "05 — Parcours"
        name: "parcours"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre de la section", name: "title", widget: "string" }
              - { label: "Titre de la section (anglais — vide = texte français)", name: "title_en", widget: "string", required: false }
              - label: "Éléments"
                name: "items"
                widget: "list"
                summary: "{{fields.year}} — {{fields.title}}"
                fields:
                  - { label: "Année", name: "year", widget: "number", value_type: "int" }
                  - { label: "Titre", name: "title", widget: "string" }
                  - { label: "Titre (anglais — vide = texte français)", name: "title_en", widget: "string", required: false }
                  - { label: "Détail (lieu, ville...)", name: "detail", widget: "string" }
                  - { label: "Détail (anglais — vide = texte français)", name: "detail_en", widget: "string", required: false }

      - file: "src/content/about.json"
        label: "06 — About"
        name: "about"
        fields:
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Téléphone", name: "phone", widget: "string" }
          - { label: "Localisation", name: "location", widget: "string" }
          - { label: "Localisation (anglais — vide = texte français)", name: "location_en", widget: "string", required: false }
          - label: "Biographie (un paragraphe par bloc)"
            name: "bio"
            widget: "list"
            field: { label: "Paragraphe", name: "paragraph", widget: "text" }
          - label: "Biographie (anglais — vide = texte français)"
            name: "bio_en"
            widget: "list"
            required: false
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Réseaux / liens"
            name: "social"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nom affiché", name: "name", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  # Travaux : une entrée = une image (+ sa légende). « Nouveau » pour en
  # ajouter une, supprimer l'entrée pour la retirer du site.
  - name: "travaux_photos"
    label: "🖼 Travaux — Photos"
    label_singular: "photo"
    description: "Chaque entrée est une image de l'onglet Photos. Légende facultative : sans titre, l'image s'affiche sans légende."
    folder: "src/content/travaux/photos"
    media_folder: "/public/travaux/photos"
    public_folder: "/travaux/photos"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "image"
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{ordre}} · {{title | default('(sans légende)')}}"
    sortable_fields: ["ordre", "title"]
    fields:
      - { label: "Image", name: "image", widget: "image", choose_url: false }
      - { label: "Titre", name: "title", widget: "string", required: false }
      - { label: "Technique / matériaux", name: "medium", widget: "string", required: false }
      - { label: "Technique / matériaux (anglais — vide = texte français)", name: "medium_en", widget: "string", required: false }
      - { label: "Dimensions / détails", name: "details", widget: "string", required: false }
      - { label: "Dimensions / détails (anglais — vide = texte français)", name: "details_en", widget: "string", required: false }
      - { label: "Année", name: "year", widget: "string", required: false }
      - label: "Ordre"
        name: "ordre"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Plus petit = affiché en premier. Les images existantes vont de 10 en 10 : mets 15 pour en glisser une entre la 1re et la 2e."

  - name: "travaux_sculptures"
    label: "🖼 Travaux — Sculptures / Installations"
    label_singular: "sculpture / installation"
    description: "Chaque entrée est une image de l'onglet Sculptures / Installations."
    folder: "src/content/travaux/sculptures"
    media_folder: "/public/travaux/sculptures"
    public_folder: "/travaux/sculptures"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "image"
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{ordre}} · {{title | default('(sans légende)')}}"
    sortable_fields: ["ordre", "title"]
    fields:
      - { label: "Image", name: "image", widget: "image", choose_url: false }
      - { label: "Titre", name: "title", widget: "string", required: false }
      - { label: "Technique / matériaux", name: "medium", widget: "string", required: false }
      - { label: "Technique / matériaux (anglais — vide = texte français)", name: "medium_en", widget: "string", required: false }
      - { label: "Dimensions / détails", name: "details", widget: "string", required: false }
      - { label: "Dimensions / détails (anglais — vide = texte français)", name: "details_en", widget: "string", required: false }
      - { label: "Année", name: "year", widget: "string", required: false }
      - label: "Ordre"
        name: "ordre"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Plus petit = affiché en premier. Les images existantes vont de 10 en 10 : mets 15 pour en glisser une entre la 1re et la 2e."

  - name: "travaux_graphiques"
    label: "🖼 Travaux — Arts graphiques"
    label_singular: "œuvre graphique"
    description: "Chaque entrée est une image de l'onglet Arts graphiques."
    folder: "src/content/travaux/graphiques"
    media_folder: "/public/travaux/graphiques"
    public_folder: "/travaux/graphiques"
    format: "json"
    extension: "json"
    create: true
    delete: true
    identifier_field: "image"
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    summary: "{{ordre}} · {{title | default('(sans légende)')}}"
    sortable_fields: ["ordre", "title"]
    fields:
      - { label: "Image", name: "image", widget: "image", choose_url: false }
      - { label: "Titre", name: "title", widget: "string", required: false }
      - { label: "Technique / matériaux", name: "medium", widget: "string", required: false }
      - { label: "Technique / matériaux (anglais — vide = texte français)", name: "medium_en", widget: "string", required: false }
      - { label: "Dimensions / détails", name: "details", widget: "string", required: false }
      - { label: "Dimensions / détails (anglais — vide = texte français)", name: "details_en", widget: "string", required: false }
      - { label: "Année", name: "year", widget: "string", required: false }
      - label: "Ordre"
        name: "ordre"
        widget: "number"
        value_type: "int"
        default: 0
        hint: "Plus petit = affiché en premier. Les images existantes vont de 10 en 10 : mets 15 pour en glisser une entre la 1re et la 2e."

  - name: "reglages"
    label: "⚙️ Réglages globaux"
    description: "Éléments communs à toutes les pages."
    files:
      - file: "src/content/site.json"
        label: "Bandeau défilant"
        name: "site"
        fields:
          - label: "Texte du bandeau défilant (bas de chaque page)"
            name: "marquee"
            widget: "string"
          - { label: "Texte du bandeau (anglais — vide = texte français)", name: "marquee_en", widget: "string", required: false }
